<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: #2d2d2a;
            color: #f4e8d0;
            height: 100vh;
            overflow: hidden;
            position: relative;
            border: 3px solid #ea9346;
            box-shadow: 0 0 30px rgba(234, 147, 70, 0.3);
        }

        /* Decorative background elements */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(234, 147, 70, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(74, 155, 155, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Sparkle decorations */
        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .sparkle::before,
        .sparkle::after {
            content: '';
            position: absolute;
            background: #ea9346;
            opacity: 0.3;
        }

        .sparkle::before {
            width: 20px;
            height: 3px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        .sparkle::after {
            width: 3px;
            height: 20px;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }

        .sparkle-1 { top: 15%; left: 10%; }
        .sparkle-2 { top: 70%; right: 15%; opacity: 0.5; }
        .sparkle-3 { bottom: 20%; left: 20%; transform: scale(0.7); }

        /* Window control buttons - floating in top right */
        .window-controls {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 100;
            -webkit-app-region: no-drag;
        }

        .window-btn {
            width: 36px;
            height: 36px;
            background: rgba(58, 58, 54, 0.9);
            border: 2px solid #4a4a42;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #8a8a7a;
            font-size: 20px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .window-btn:hover {
            background: rgba(74, 74, 66, 0.9);
            border-color: #ea9346;
            color: #f4e8d0;
            transform: translateY(-1px);
        }

        .window-btn.close:hover {
            background: #c4534f;
            border-color: #c4534f;
            color: white;
        }

        .title-bar {
            display: none;
        }

        .title-bar-left {
            display: none;
        }

        .app-icon {
            display: none;
        }

        .app-title {
            display: none;
        }

        .title-bar-buttons {
            display: none;
        }

        .title-btn {
            display: none;
        }

        .container {
            padding: 30px;
            height: 100vh;
            overflow: visible;
            position: relative;
            z-index: 1;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #ea9346 0%, #f4a460 50%, #ea9346 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            margin-bottom: 4px;
            text-shadow: 0 2px 20px rgba(234, 147, 70, 0.3);
        }

        .logo p {
            font-size: 11px;
            color: #8a8a7a;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .status-card {
            background: linear-gradient(135deg, #3a3a36 0%, #36362f 100%);
            border: 2px solid #4a4a42;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ea9346, transparent);
            opacity: 0.5;
        }

        .status-main {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .status-main.recording {
            color: #ea9346;
        }

        .status-main.idle {
            color: #4a9b9b;
        }

        .status-main.stopped {
            color: #8a8a7a;
        }

        .recording-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ea9346;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px rgba(234, 147, 70, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .status-detail {
            font-size: 13px;
            color: #8a8a7a;
        }

        .section-label {
            font-size: 10px;
            color: #8a8a7a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .mode-btn {
            background: #3a3a36;
            border: 2px solid #4a4a42;
            color: #8a8a7a;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Space Grotesk', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(234, 147, 70, 0.1), transparent);
            transition: left 0.5s;
        }

        .mode-btn:hover::before {
            left: 100%;
        }

        .mode-btn:hover {
            border-color: #ea9346;
            color: #ea9346;
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ea9346, #d97835);
            border-color: #ea9346;
            color: #2d2d2a;
            box-shadow: 0 4px 15px rgba(234, 147, 70, 0.3);
        }

        .app-selector {
            margin-bottom: 24px;
        }

        .app-selector select {
            width: 100%;
            padding: 14px 16px;
            background: #3a3a36;
            border: 2px solid #4a4a42;
            border-radius: 12px;
            color: #f4e8d0;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.2s;
        }

        .app-selector select:focus {
            outline: none;
            border-color: #ea9346;
            box-shadow: 0 0 0 3px rgba(234, 147, 70, 0.1);
        }

        .app-selector select option {
            background: #3a3a36;
        }

        .start-btn {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .start-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .start-btn.start {
            background: linear-gradient(135deg, #4a9b9b, #3a8080);
            color: white;
            box-shadow: 0 4px 15px rgba(74, 155, 155, 0.3);
        }

        .start-btn.start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 155, 155, 0.4);
        }

        .start-btn.stop {
            background: linear-gradient(135deg, #c4534f, #a84340);
            color: white;
            box-shadow: 0 4px 15px rgba(196, 83, 79, 0.3);
        }

        .start-btn.stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 83, 79, 0.4);
        }

        .start-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .hotkeys-card {
            background: #3a3a36;
            border: 2px solid #4a4a42;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .hotkeys-card h3 {
            font-size: 13px;
            color: #ea9346;
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hotkey-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            padding: 10px 0;
            border-bottom: 1px solid #4a4a42;
        }

        .hotkey-item:last-child {
            margin-bottom: 0;
            border-bottom: none;
        }

        .hotkey-name {
            color: #f4e8d0;
        }

        .hotkey-key {
            background: rgba(234, 147, 70, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            border: 1px solid rgba(234, 147, 70, 0.3);
            color: #ea9346;
            font-size: 12px;
            font-weight: 600;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            background: #3a3a36;
            border: 2px solid #4a4a42;
            color: #8a8a7a;
            padding: 14px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Space Grotesk', sans-serif;
        }

        .action-btn:hover {
            border-color: #4a9b9b;
            color: #4a9b9b;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        /* Curved accent lines */
        .curve-accent {
            position: absolute;
            width: 200px;
            height: 100px;
            border: 3px solid;
            border-color: transparent #ea9346 #ea9346 transparent;
            border-radius: 0 0 100px 0;
            opacity: 0.1;
            pointer-events: none;
        }

        .curve-accent-1 {
            top: 10%;
            right: 5%;
            transform: rotate(-15deg);
        }

        .curve-accent-2 {
            bottom: 15%;
            left: 8%;
            transform: rotate(165deg);
            border-color: transparent #4a9b9b #4a9b9b transparent;
        }
    </style>
</head>
<body>
    <!-- Decorative sparkles -->
    <div class="sparkle sparkle-1"></div>
    <div class="sparkle sparkle-2"></div>
    <div class="sparkle sparkle-3"></div>
    
    <!-- Curved accents -->
    <div class="curve-accent curve-accent-1"></div>
    <div class="curve-accent curve-accent-2"></div>

    <!-- Window controls -->
    <div class="window-controls">
        <button class="window-btn" onclick="minimizeWindow()">−</button>
        <button class="window-btn close" onclick="closeWindow()">×</button>
    </div>

    <div class="container">
        <div class="logo">
            <h1>CHRONO</h1>
            <p>Clip Recorder</p>
        </div>

        <div class="status-card">
            <div class="status-main stopped" id="status">
                Standby
            </div>
            <div class="status-detail" id="status-detail">
                Select a mode to begin
            </div>
        </div>

        <div class="section-label">Recording Mode</div>
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="Application" onclick="selectMode('Application')">
                Application
            </button>
            <button class="mode-btn" data-mode="Display" onclick="selectMode('Display')">
                Display
            </button>
        </div>

        <div class="app-selector" id="app-selector">
            <div class="section-label">Select Application</div>
            <select id="app-select" onchange="onAppSelected()">
                <option value="">Choose an app...</option>
            </select>
        </div>

        <button class="start-btn start" id="start-btn" onclick="toggleRecording()">
            Start Recording
        </button>

        <div class="hotkeys-card">
            <h3>Hotkeys</h3>
            <div id="hotkey-list">
                <div class="hotkey-item">
                    <span class="hotkey-name">Loading...</span>
                </div>
            </div>
        </div>

        <div class="section-label">Quick Actions</div>
        <div class="actions">
            <button class="action-btn" onclick="openSettings()">⚙ Settings</button>
            <button class="action-btn" onclick="openClipsFolder()">📁 Clips</button>
            <button class="action-btn" onclick="openLibrary()">📚 Library</button>
        </div>
    </div>

    <script>
        // Window dragging functionality
        let isDraggingWindow = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        document.addEventListener('mousedown', (e) => {
            // Only allow dragging from top 50 pixels
            if (e.clientY > 50) {
                return;
            }
            
            // Don't drag if clicking on buttons, inputs, or selects
            if (e.target.tagName === 'BUTTON' || 
                e.target.tagName === 'INPUT' || 
                e.target.tagName === 'SELECT' ||
                e.target.closest('.window-controls')) {
                return;
            }
            
            isDraggingWindow = true;
            dragOffsetX = e.clientX;
            dragOffsetY = e.clientY;
            sendMessage('startDrag', { offsetX: e.clientX, offsetY: e.clientY });
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingWindow) {
                sendMessage('dragWindow', { screenX: e.screenX, screenY: e.screenY });
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDraggingWindow) {
                isDraggingWindow = false;
                sendMessage('stopDrag');
            }
        });

        let currentMode = 'Application';
        let selectedApp = '';
        let isRecording = false;
        let availableApps = [];

        window.addEventListener('DOMContentLoaded', () => {
            sendMessage('getRunningApps');
            sendMessage('getConfig');
        });

        function sendMessage(action, data = {}) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({ action, ...data });
            }
        }

        function selectMode(mode) {
            currentMode = mode;
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            const appSelector = document.getElementById('app-selector');
            
            if (mode === 'Display') {
                appSelector.classList.add('hidden');
                selectedApp = '';
            } else {
                appSelector.classList.remove('hidden');
                document.getElementById('app-select').selectedIndex = 0;
                selectedApp = '';
            }

            updateStartButton();
            sendMessage('setMode', { mode });
        }

        function onAppSelected() {
            selectedApp = document.getElementById('app-select').value;
            updateStartButton();
        }

        function updateStartButton() {
            const btn = document.getElementById('start-btn');
            
            if (isRecording) {
                btn.className = 'start-btn stop';
                btn.textContent = 'Stop Recording';
                btn.disabled = false;
            } else {
                btn.className = 'start-btn start';
                btn.textContent = 'Start Recording';
                btn.disabled = (currentMode !== 'Display' && !selectedApp);
            }
        }

        function toggleRecording() {
            if (isRecording) {
                sendMessage('stopRecording');
                isRecording = false;
                updateStatus('stopped', 'Standby', 'Recording stopped');
            } else {
                sendMessage('startRecording', { mode: currentMode, app: selectedApp });
                isRecording = true;
                updateStatus('idle', `Waiting for ${selectedApp || 'display'}`, 'Monitoring...');
            }
            updateStartButton();
        }

        function updateStatus(type, main, detail) {
            const statusEl = document.getElementById('status');
            const detailEl = document.getElementById('status-detail');
            
            statusEl.className = `status-main ${type}`;
            statusEl.innerHTML = type === 'recording' ? 
                `<span class="recording-dot"></span>${main}` : main;
            detailEl.textContent = detail;
        }

        function updateHotkeysDisplay(hotkeys) {
            const list = document.getElementById('hotkey-list');
            if (!list || !hotkeys || hotkeys.length === 0) return;
            
            list.innerHTML = hotkeys.map(h => {
                const mods = h.Modifiers.join(' + ');
                const key = mods ? `${mods} + ${h.Key}` : h.Key;
                return `
                    <div class="hotkey-item">
                        <span class="hotkey-name">${h.Name} (${h.ClipLengthSeconds}s)</span>
                        <span class="hotkey-key">${key}</span>
                    </div>
                `;
            }).join('');
        }

        function openSettings() {
            sendMessage('openSettings');
        }

        function openClipsFolder() {
            sendMessage('openClipsFolder');
        }

        function openLibrary() {
            sendMessage('openLibrary');
        }

        function minimizeWindow() {
            sendMessage('minimizeWindow');
        }

        function closeWindow() {
            sendMessage('closeWindow');
        }

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
                const data = event.data;
                
                if (data.action === 'runningApps') {
                    availableApps = data.apps;
                    const select = document.getElementById('app-select');
                    select.innerHTML = '<option value="">Choose an app...</option>';
                    data.apps.forEach(app => {
                        const option = document.createElement('option');
                        option.value = app;
                        option.textContent = app;
                        select.appendChild(option);
                    });
                }
                
                if (data.action === 'statusUpdate') {
                    updateStatus(data.type, data.main, data.detail);
                }

                if (data.action === 'config') {
                    currentMode = data.mode;
                    selectedApp = data.selectedApp;
                    isRecording = data.enabled;
                    
                    selectMode(currentMode);
                    if (selectedApp) {
                        document.getElementById('app-select').value = selectedApp;
                    }
                    
                    if (data.hotkeys && data.hotkeys.length > 0) {
                        updateHotkeysDisplay(data.hotkeys);
                    }
                    
                    updateStartButton();
                }
            });
        }
    </script>
</body>
</html>
